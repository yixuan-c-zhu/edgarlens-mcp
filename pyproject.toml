[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edgarlens-mcp"
version = "0.1.0"
description = "MCP server for SEC EDGAR: company lookup, filings, and clean, cited XBRL financials."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Yixuan (Connie) Zhu" }]
keywords = ["mcp", "sec", "edgar", "xbrl", "llm", "agents"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyyaml>=6",
]

[project.scripts]
edgarlens-mcp = "edgarlens.server:main"

[project.urls]
Homepage = "https://github.com/yixuan-c-zhu/edgarlens-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/edgarlens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
